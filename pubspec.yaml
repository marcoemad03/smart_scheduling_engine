name: reception_workforce_scheduler
description: A production-ready Flutter application for managing hospital reception employee schedules with flexibility and configurability.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.4.9
  firebase_core: ^2.24.2
  firebase_auth: ^4.16.0
  cloud_firestore: ^4.13.0
  firebase_storage: ^11.6.0
  firebase_messaging: ^14.8.0
  go_router: ^14.3.0
  uuid: ^4.2.2
  intl: ^0.18.1
  flutter_local_notifications: ^15.1.0
  timezone: ^0.9.4
  table_calendar: ^3.0.9
  syncfusion_flutter_calendar: ^27.1.55
  equatable: ^2.1.0
  logger: ^2.0.2+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
        - asset: assets/fonts/Inter-SemiBold.ttf
        - asset: assets/fonts/Inter-Bold.ttf