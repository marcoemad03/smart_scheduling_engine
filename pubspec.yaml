name: reception_workforce_scheduler
description: A production-ready Flutter application for managing hospital reception employee schedules with flexibility and configurability.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.4.9
  shared_preferences: ^2.2.2
  firebase_core: 4.14.0
  firebase_auth: 6.6.0
  cloud_firestore: 6.9.0
  firebase_storage: 13.5.0
  firebase_messaging: 16.6.0
  go_router: ^14.3.0
  uuid: ^4.2.2
  intl: ^0.19.0
  flutter_local_notifications: ^15.1.0
  timezone: ^0.9.4
  table_calendar: ^3.0.9
  equatable: ^2.1.0
  logger: ^2.0.2+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
